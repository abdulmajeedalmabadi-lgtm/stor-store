<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111629" />
    <meta name="description" content="متجر STOR للتيشيرتات — اختر اللون والمقاس المناسبين لك." />
    <title>STOR | متجر التيشيرتات</title>

    <!-- CSS للتنسيق فقط، وJavaScript للسلوك فقط. -->
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#app"> انتقل إلى المحتوى </a>

    <!-- 1. الهيكل الثابت: ترويسة الدسكتوب وتنقل الجوال. -->
    <header class="site-header">
      <div class="container header-layout">
        <a class="brand" href="#home" aria-label="STOR الرئيسية">ST<span>O</span>R</a>
        <nav class="desktop-nav" aria-label="التنقل الرئيسي">
          <a href="#home" data-nav="home"> الرئيسية </a>
          <a href="#products" data-nav="products"> المنتجات </a>
          <a href="#orders" data-nav="orders"> طلباتي </a>
        </nav>
        <div class="header-actions">
          <a
            class="icon-button desktop-account"
            href="#account"
            aria-label="حسابي"
            data-icon="user"
          >
          </a>
          <a class="icon-button" href="#favorites" aria-label="المفضلة" data-icon="heart"> </a>
          <a class="icon-button" href="#cart" id="cart-link" aria-label="السلة">
            <span data-icon="cart"> </span>
            <span class="count-badge" id="cart-count" hidden> 0 </span>
          </a>
        </div>
      </div>
    </header>

    <!-- JavaScript ينسخ قالب الصفحة المطلوبة إلى هذه المساحة. -->
    <main class="container main-content" id="app" tabindex="-1"></main>
    <footer class="site-footer container">
      <a class="brand" href="#home">ST<span>O</span>R</a>
      <p>ألوان تختارها أنت. إطلالة لكل يوم.</p>
      <small> حسابك وطلباتك محفوظة في قاعدة بيانات المتجر. </small>
      <a class="text-link" href="admin.html">دخول الإدارة</a>
    </footer>
    <nav class="mobile-nav" aria-label="تنقل الجوال">
      <a href="#home" data-nav="home">
        <span data-icon="home"> </span>
        الرئيسية
      </a>
      <a href="#products" data-nav="products">
        <span data-icon="grid"> </span>
        المنتجات
      </a>
      <a href="#orders" data-nav="orders">
        <span data-icon="cart"> </span>
        طلباتي
      </a>
      <a href="#account" data-nav="account">
        <span data-icon="user"> </span>
        حسابي
      </a>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript>
      <p class="container">فعّل JavaScript لاستخدام المتجر.</p>
    </noscript>

    <!-- رموز SVG الثابتة: ينسخها JavaScript للأماكن الموسومة data-icon. -->
    <svg class="icon-library" hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-home" viewbox="0 0 24 24">
        <path d="m3 10 9-7 9 7v11h-7v-7H10v7H3z" />
      </symbol>
      <symbol id="icon-grid" viewbox="0 0 24 24">
        <rect x="3" y="3" width="18" height="18" rx="3" />
        <path d="M3 9h18M3 15h18M9 3v18M15 3v18" />
      </symbol>
      <symbol id="icon-user" viewbox="0 0 24 24">
        <circle cx="12" cy="8" r="4" />
        <path d="M4 22v-3a8 8 0 0 1 16 0v3" />
      </symbol>
      <symbol id="icon-cart" viewbox="0 0 24 24">
        <path d="M3 3h2l3 13h11l3-10H6" />
        <circle cx="9" cy="21" r="1" />
        <circle cx="18" cy="21" r="1" />
      </symbol>
      <symbol id="icon-search" viewbox="0 0 24 24">
        <circle cx="10" cy="10" r="7" />
        <path d="m15 15 6 6" />
      </symbol>
      <symbol id="icon-heart" viewbox="0 0 24 24">
        <path d="M20 5a5 5 0 0 0-8 1 5 5 0 0 0-8-1c-5 5 8 15 8 15s13-10 8-15z" />
      </symbol>
      <symbol id="icon-back" viewbox="0 0 24 24">
        <path d="M4 12h16m-6-6 6 6-6 6" />
      </symbol>
      <symbol id="icon-trash" viewbox="0 0 24 24">
        <path d="M3 6h18M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7" />
      </symbol>
    </svg>

    <!-- 2. مكونات مشتركة: template يخزن HTML دون إظهاره قبل نسخه. -->
    <template id="page-heading-template">
      <div class="page-heading">
        <a class="back-link" data-bind="back">
          <span data-icon="back"> </span>
          رجوع
        </a>
        <h1 data-bind="title"></h1>
        <p class="muted" data-bind="subtitle" hidden></p>
      </div>
    </template>
    <template id="product-card-template">
      <article class="product-card">
        <a class="product-card-image" data-bind="link">
          <img data-bind="image" loading="lazy" decoding="async" width="512" height="512" />
        </a>
        <div class="product-card-body">
          <span class="tag" data-bind="tag"> </span>
          <a data-bind="name-link">
            <h3 data-bind="name"></h3>
          </a>
          <div class="product-card-bottom">
            <strong data-bind="price"> </strong>
            <button class="button button-primary" data-bind="buy" type="button"></button>
          </div>
        </div>
      </article>
    </template>
    <template id="empty-template">
      <section class="empty-state panel">
        <div class="status-mark" data-icon="cart"></div>
        <h2 data-bind="title"></h2>
        <p class="muted" data-bind="message"></p>
        <a class="button button-primary" data-bind="action"> </a>
      </section>
    </template>
    <template id="totals-template">
      <dl class="totals">
        <div>
          <dt>المجموع</dt>
          <dd data-bind="subtotal"></dd>
        </div>
        <div>
          <dt>الشحن</dt>
          <dd data-bind="shipping"></dd>
        </div>
        <div class="total-row">
          <dt>الإجمالي</dt>
          <dd data-bind="total"></dd>
        </div>
      </dl>
    </template>

    <!-- 3. الرئيسية: قسم ترحيبي واسع وشبكة أحدث المنتجات. -->
    <template id="home-template">
      <section class="hero">
        <div class="hero-content">
          <span class="eyebrow" lang="en" dir="ltr"> STOR / NEW COLLECTION </span>
          <h1>
            تيشيرتات جديدة.
            <br />
            ألوان تشبهك.
          </h1>
          <p>تشكيلة يومية بتصاميم بسيطة وألوان تختارها أنت.</p>
          <a class="button button-light" href="#products"> اكتشف التشكيلة ← </a>
        </div>
        <div class="hero-visual">
          <img
            src="assets/image5.png"
            alt="تيشيرت أسود من التشكيلة الجديدة"
            width="512"
            height="512"
          />
          <span class="hero-label"> تفاصيل بسيطة. حضور مختلف. </span>
        </div>
      </section>
      <section aria-labelledby="latest-title">
        <div class="section-heading">
          <div>
            <span class="eyebrow muted"> اختيارات STOR </span>
            <h2 id="latest-title">أحدث المنتجات</h2>
          </div>
          <a class="text-link" href="#products"> عرض الكل ← </a>
        </div>
        <div class="chips category-tabs" aria-label="فئات المنتجات">
          <button class="chip" data-category="tee" type="button">تيشيرتات</button>
          <button class="chip" data-category="hoodie" type="button">سويتشرتات</button>
        </div>
        <div class="product-grid home-grid" id="home-products"></div>
      </section>
    </template>

    <!-- 4. المنتجات والمفضلة: بحث وترتيب وتوفر، دون فلتر للمقاس. -->
    <template id="catalog-template">
      <section class="catalog-toolbar panel" aria-label="خيارات عرض المنتجات">
        <div class="search-field">
          <span data-icon="search"> </span>
          <label class="sr-only" for="product-search"> البحث عن منتج </label>
          <input
            id="product-search"
            type="search"
            placeholder="ابحث عن تيشيرتك المفضل"
            autocomplete="off"
          />
        </div>
        <div class="chips" aria-label="توفر المنتجات">
          <button class="chip" data-filter="all" type="button">الكل</button>
          <button class="chip" data-filter="available" type="button">المتوفر فقط</button>
        </div>
        <div class="sort-field">
          <label class="sr-only" for="product-sort"> ترتيب المنتجات </label>
          <select id="product-sort">
            <option value="new">الأحدث</option>
            <option value="low">السعر: الأقل أولًا</option>
            <option value="high">السعر: الأعلى أولًا</option>
          </select>
        </div>
      </section>
      <div class="section-heading">
        <h2 id="catalog-title">كل المنتجات</h2>
        <span class="muted" id="result-count" role="status"> </span>
      </div>
      <div class="product-grid" id="product-results"></div>
    </template>

    <!-- 5. المنتج: معرض محسوب الارتفاع وخيارات شراء بجانبه على الدسكتوب. -->
    <template id="product-template">
      <div class="product-layout">
        <section class="gallery" aria-label="صور المنتج">
          <div class="product-stage">
            <img id="shirt-image" alt="" decoding="async" />
          </div>
          <div class="gallery-thumbnails" aria-label="اختيار صورة المنتج">
            <button class="thumbnail" data-view="0" type="button" aria-label="الصورة الأصلية">
              <img alt="" />
              <span> الصورة الأصلية </span>
            </button>
            <button class="thumbnail" data-view="1" type="button" aria-label="عرض أمامي">
              <img alt="" />
              <span> عرض أمامي </span>
            </button>
            <button class="thumbnail" data-view="2" type="button" aria-label="تفاصيل القماش">
              <img class="thumbnail-detail" alt="" />
              <span> تفاصيل القماش </span>
            </button>
          </div>
          <p class="note gallery-note">
            الصورة الأمامية مولّدة لتوضيح اللون. معاينة اللون تقريبية وقد تختلف عن المنتج الفعلي.
          </p>
        </section>
        <section class="product-options panel" aria-labelledby="product-title">
          <div class="flex-between">
            <span class="tag" id="product-tag"> </span>
            <button
              class="icon-button"
              id="favorite-button"
              type="button"
              aria-label="إضافة إلى المفضلة"
              aria-pressed="false"
              data-icon="heart"
            ></button>
          </div>
          <h2 id="product-title"></h2>
          <p class="muted" id="product-description"></p>
          <p class="product-price" id="product-price"></p>
          <div class="option-section">
            <div class="flex-between">
              <h3>اختر اللون</h3>
              <span class="muted" id="color-name"> </span>
            </div>
            <div
              class="color-options"
              id="color-options"
              role="group"
              aria-label="الألوان الجاهزة"
            ></div>
            <div class="custom-color">
              <input id="custom-color" type="color" aria-label="اختر أي لون" />
              <label for="custom-color"> أو اختر أي لون </label>
              <input
                id="hex-color"
                type="text"
                aria-label="رمز اللون"
                pattern="#[0-9a-fA-F]{6}"
                maxlength="7"
                spellcheck="false"
                dir="ltr"
              />
            </div>
          </div>
          <div class="field option-section">
            <span class="field-label" id="size-label"> المقاس </span>
            <button
              class="size-trigger"
              id="size-button"
              type="button"
              aria-expanded="false"
              aria-controls="size-options"
              aria-labelledby="size-label size-value"
            >
              <span id="size-value"> اختر مقاسك </span>
              <span aria-hidden="true"> ⌄ </span>
            </button>
            <div
              class="size-options"
              id="size-options"
              role="group"
              aria-label="المقاسات المتاحة"
              hidden
            ></div>
          </div>
          <div class="purchase-row">
            <div class="quantity-control" aria-label="الكمية">
              <button type="button" data-detail-quantity="-1" aria-label="تقليل الكمية">−</button>
              <output id="product-quantity"> 1 </output>
              <button type="button" data-detail-quantity="1" aria-label="زيادة الكمية">+</button>
            </div>
            <button class="button button-primary" id="add-to-cart" type="button">
              أضف إلى السلة
            </button>
          </div>
          <p class="field-error" id="size-error" role="alert"></p>
          <dl class="product-specifications">
            <div>
              <dt>التوفر</dt>
              <dd id="product-stock"></dd>
            </div>
            <div>
              <dt>الشحن</dt>
              <dd>15 ر.س لكل طلب</dd>
            </div>
          </dl>
        </section>
      </div>
    </template>
    <template id="color-option-template">
      <button class="color-option" type="button" aria-pressed="false">
        <span class="color-dot" aria-hidden="true"> </span>
        <span data-bind="name"> </span>
      </button>
    </template>

    <!-- 6. السلة وإتمام الطلب: محتوى أساسي وملخص جانبي على الدسكتوب. -->
    <template id="cart-template">
      <div class="checkout-layout">
        <section class="cart-list" id="cart-items" aria-label="منتجات السلة"></section>
        <aside class="panel order-summary">
          <h2>ملخص الطلب</h2>
          <div id="cart-totals"></div>
          <a class="button button-primary full-width" href="#checkout"> إتمام الطلب </a>
          <p class="note">يمكنك مراجعة اللون والمقاس قبل تأكيد الطلب.</p>
        </aside>
      </div>
    </template>
    <template id="cart-item-template">
      <article class="panel cart-item">
        <a class="cart-item-image" data-bind="link">
          <img data-bind="image" alt="" />
        </a>
        <div class="cart-item-info">
          <h3 data-bind="name"></h3>
          <p class="note">
            <span data-bind="size"> </span>
            ·
            <span class="saved-color" data-bind="swatch"> </span>
            <span data-bind="color"> </span>
          </p>
          <strong data-bind="price"> </strong>
        </div>
        <div class="quantity-control">
          <button type="button" data-bind="decrease" aria-label="تقليل الكمية">−</button>
          <output data-bind="quantity"> </output>
          <button type="button" data-bind="increase" aria-label="زيادة الكمية">+</button>
        </div>
        <button
          class="icon-button remove-item"
          data-bind="remove"
          type="button"
          data-icon="trash"
        ></button>
      </article>
    </template>
    <template id="checkout-template">
      <form id="checkout-form">
        <div class="checkout-layout">
          <section class="panel checkout-fields">
            <h2>بيانات العميل</h2>
            <div class="form-grid">
              <div class="field">
                <label for="full-name"> الاسم الكامل </label>
                <input id="full-name" name="name" autocomplete="name" required minlength="3" />
              </div>
              <div class="field">
                <label for="phone"> رقم الجوال </label>
                <input
                  id="phone"
                  name="phone"
                  type="tel"
                  dir="ltr"
                  autocomplete="tel"
                  placeholder="05xxxxxxxx"
                  pattern="(05[0-9]{8}|[+]9665[0-9]{8})"
                  required
                  title="رقم سعودي يبدأ بـ05 أو +9665"
                />
              </div>
              <div class="field full-span">
                <label for="customer-email"> البريد الإلكتروني </label>
                <input
                  id="customer-email"
                  name="email"
                  type="email"
                  dir="ltr"
                  autocomplete="email"
                  required
                />
              </div>
            </div>
            <h2>عنوان التسليم</h2>
            <div class="form-grid">
              <div class="field">
                <label for="city"> المدينة </label>
                <input
                  id="city"
                  name="city"
                  autocomplete="address-level2"
                  placeholder="الرياض"
                  required
                />
              </div>
              <div class="field">
                <label for="district"> الحي </label>
                <input id="district" name="district" placeholder="حي النخيل" required />
              </div>
              <div class="field full-span">
                <label for="street"> الشارع ورقم المبنى </label>
                <input
                  id="street"
                  name="street"
                  autocomplete="street-address"
                  required
                  minlength="4"
                />
              </div>
              <div class="field">
                <label for="postal"> الرمز البريدي (اختياري) </label>
                <input
                  id="postal"
                  name="postal"
                  inputmode="numeric"
                  pattern="[0-9]{5}"
                  autocomplete="postal-code"
                />
              </div>
              <div class="field">
                <label for="shipper"> شركة الشحن </label>
                <select id="shipper" name="shipper">
                  <option>سبريد</option>
                  <option>سمسا</option>
                  <option>أرامكس</option>
                </select>
              </div>
            </div>
            <div class="field">
              <span class="field-label"> طريقة الدفع </span>
              <p class="payment-method">دفع عند الاستلام</p>
            </div>
            <p class="note">سيُحفظ الطلب وتُجهّز فاتورته للإرسال بالبريد. الدفع عند الاستلام.</p>
          </section>
          <aside class="panel order-summary">
            <h2>مراجعة الطلب</h2>
            <div id="checkout-items"></div>
            <div id="checkout-totals"></div>
            <button class="button button-primary full-width" type="submit">تأكيد الطلب</button>
          </aside>
        </div>
      </form>
    </template>
    <template id="summary-item-template">
      <div class="summary-item">
        <div>
          <strong data-bind="name"> </strong>
          <small data-bind="details"> </small>
        </div>
        <strong data-bind="price"> </strong>
      </div>
    </template>

    <!-- 7. تأكيد الطلب، سجل الطلبات، التتبع والفاتورة. -->
    <template id="success-template">
      <section class="confirmation panel">
        <div class="status-mark" aria-hidden="true">✓</div>
        <span class="eyebrow muted"> شكرًا لاختيارك STOR </span>
        <h1>تم تأكيد الطلب</h1>
        <p class="muted" id="success-number"></p>
        <div class="confirmation-actions">
          <a class="button button-primary" id="track-order"> متابعة الطلب </a>
          <a class="button button-secondary" id="view-invoice"> عرض الفاتورة </a>
        </div>
        <p class="note">حُفظ طلبك في المتجر، وستصل فاتورته إلى بريد حسابك عند إرسالها.</p>
      </section>
    </template>
    <template id="orders-template">
      <section class="orders-grid" id="orders-list" aria-label="سجل الطلبات"></section>
    </template>
    <template id="order-card-template">
      <a class="panel order-card" data-bind="link">
        <div class="flex-between">
          <h2 data-bind="number"></h2>
          <span class="order-status"> حالة الطلب </span>
        </div>
        <p class="muted" data-bind="date"></p>
        <div class="flex-between">
          <span data-bind="items"> </span>
          <strong data-bind="total"> </strong>
        </div>
        <span class="text-link"> عرض التفاصيل ← </span>
      </a>
    </template>
    <template id="tracking-template">
      <div class="checkout-layout">
        <section class="panel">
          <h2 id="tracking-number"></h2>
          <p class="note">تُحدّث هذه الحالات من لوحة إدارة المتجر.</p>
          <ol class="timeline">
            <li class="timeline-step completed">
              <h3>تم تأكيد الطلب</h3>
              <small id="tracking-date"> </small>
            </li>
            <li class="timeline-step">
              <h3>تم الشحن</h3>
              <small> لم يتم الشحن </small>
            </li>
            <li class="timeline-step">
              <h3>جاري التوصيل</h3>
              <small> بانتظار الشحن </small>
            </li>
          </ol>
        </section>
        <aside class="panel order-summary">
          <h2>بيانات التوصيل</h2>
          <p id="tracking-name"></p>
          <p class="muted" id="tracking-address"></p>
          <a class="button button-primary full-width" id="tracking-invoice"> عرض الفاتورة </a>
        </aside>
      </div>
    </template>
    <template id="invoice-template">
      <section class="invoice-layout">
        <article class="panel invoice-paper">
          <div class="flex-between">
            <span class="brand">ST<span>O</span>R</span>
            <h2 id="invoice-number"></h2>
          </div>
          <p class="note" id="invoice-date"></p>
          <div class="invoice-customer">
            <strong id="invoice-name"> </strong>
            <p class="muted" id="invoice-address"></p>
          </div>
          <div id="invoice-items"></div>
          <div id="invoice-totals"></div>
          <p class="note">طريقة الدفع: دفع عند الاستلام · لم يتم تحصيل أي مبلغ.</p>
        </article>
        <button class="button button-primary full-width" id="print-invoice" type="button">
          طباعة الفاتورة
        </button>
      </section>
    </template>

    <!-- 8. الحساب: بطاقة تعريف ومساحة مستقلة للإعدادات على الدسكتوب. -->
    <template id="account-template">
      <div class="account-layout">
        <aside class="panel profile-card">
          <div class="avatar" id="profile-initial"></div>
          <h2 id="profile-name"></h2>
          <p class="muted" id="profile-email"></p>
          <a class="button button-primary full-width" href="#login" id="account-login">
            تسجيل الدخول
          </a>
          <button
            class="button button-secondary full-width"
            id="logout-button"
            type="button"
            hidden
          >
            تسجيل الخروج
          </button>
        </aside>
        <section class="panel account-settings">
          <h2>إعدادات حسابك</h2>
          <p class="muted">بياناتك وطلباتك المفضلة في مكان واحد.</p>
          <a class="settings-link" href="#profile">
            <span data-icon="user"> </span>
            <div>
              <h3>بيانات الحساب</h3>
              <small> عرض البريد وتعديل الاسم </small>
            </div>
            <span> ← </span>
          </a>
          <a class="settings-link" href="#orders">
            <span data-icon="cart"> </span>
            <div>
              <h3>طلباتي</h3>
              <small> مراجعة الطلبات والفواتير </small>
            </div>
            <span> ← </span>
          </a>
          <a class="settings-link" href="#favorites">
            <span data-icon="heart"> </span>
            <div>
              <h3>المفضلة</h3>
              <small> المنتجات التي أعجبتك </small>
            </div>
            <span> ← </span>
          </a>
          <a class="settings-link" href="#addresses"
            ><span data-icon="home"></span>
            <div>
              <h3>عناوين الشحن</h3>
              <small>إضافة العناوين وحذفها</small>
            </div>
            <span>←</span></a
          >
          <p class="note">تسجيل الخروج ينهي الجلسة فقط، وتبقى بيانات حسابك وطلباتك محفوظة.</p>
        </section>
      </div>
    </template>

    <!-- 9. الدخول والتسجيل: لوحة تعريف للدسكتوب ونموذج متجاوب. -->
    <template id="auth-template">
      <div class="auth-layout">
        <aside class="auth-intro">
          <span class="eyebrow" lang="en" dir="ltr"> YOUR EVERYDAY / YOUR COLOR </span>
          <h2>استعد لتشكيلة جديدة</h2>
          <p>ابدأ رحلة التسوق بألوان تختارها أنت.</p>
          <img src="assets/image4.png" alt="تيشيرت أبيض من STOR" width="512" height="512" />
        </aside>
        <section class="panel auth-panel">
          <h1 id="auth-title"></h1>
          <p class="muted" id="auth-description"></p>
          <form id="auth-form">
            <div class="field" id="register-name-field" hidden>
              <label for="auth-name"> الاسم الكامل </label>
              <input id="auth-name" name="name" minlength="3" autocomplete="name" />
            </div>
            <div class="field">
              <label for="auth-email"> البريد الإلكتروني </label>
              <input
                id="auth-email"
                name="email"
                type="email"
                autocomplete="email"
                dir="ltr"
                required
              />
            </div>
            <div class="field">
              <label for="auth-password"> كلمة المرور </label>
              <input
                id="auth-password"
                name="password"
                type="password"
                minlength="12"
                required
                placeholder="12 حرفًا على الأقل"
              />
            </div>
            <div class="field" id="confirm-password-field" hidden>
              <label for="auth-confirm"> تأكيد كلمة المرور </label>
              <input id="auth-confirm" name="confirm" type="password" autocomplete="new-password" />
            </div>
            <p class="note">يمكنك تسجيل الخروج والعودة إلى حسابك وطلباتك في أي وقت.</p>
            <p class="field-error" id="auth-error" role="alert"></p>
            <button
              class="button button-primary full-width"
              id="auth-submit"
              type="submit"
            ></button>
          </form>
          <a class="auth-switch text-link" href="#forgot-password/customer">نسيت كلمة المرور؟</a>
          <a class="auth-switch text-link" id="auth-switch"> </a>
        </section>
      </div>
    </template>
    <template id="profile-template">
      <form class="panel profile-form" id="profile-form">
        <h2>معلوماتك الشخصية</h2>
        <p class="muted">تُحفظ التعديلات في قاعدة البيانات. البريد ثابت للحفاظ على هوية الحساب.</p>
        <div class="form-grid">
          <div class="field">
            <label for="profile-full-name"> الاسم الكامل </label>
            <input id="profile-full-name" name="name" required minlength="3" autocomplete="name" />
          </div>
          <div class="field">
            <label for="profile-mail"> البريد الإلكتروني </label>
            <input
              id="profile-mail"
              name="email"
              type="email"
              dir="ltr"
              autocomplete="email"
              required
            />
          </div>
        </div>
        <button class="button button-primary" type="submit">حفظ البيانات</button>
      </form>
    </template>
    <!-- الاتصال بالخادم وإعادة تعيين كلمات المرور والعناوين المحفوظة. -->
    <template id="loading-template">
      <div class="loading-state" role="status">جارٍ تحميل البيانات من الخادم…</div>
    </template>

    <template id="forgot-password-template">
      <section class="panel recovery-panel">
        <h1>نسيت كلمة المرور؟</h1>
        <p class="muted" id="forgot-portal"></p>
        <form id="forgot-form">
          <div class="field">
            <label for="recovery-email">البريد الإلكتروني</label>
            <input
              id="recovery-email"
              name="email"
              type="email"
              dir="ltr"
              autocomplete="email"
              required
            />
          </div>
          <p class="note">سنرسل رابطًا صالحًا لمدة محدودة إلى بريد الحساب المسجل.</p>
          <p class="field-error" role="alert"></p>
          <button class="button button-primary full-width" type="submit">
            إرسال رابط الاستعادة
          </button>
        </form>
        <p id="forgot-message" role="status"></p>
        <a class="text-link" id="forgot-back">العودة للدخول</a>
      </section>
    </template>

    <template id="reset-password-template">
      <section class="panel recovery-panel">
        <h1>تعيين كلمة مرور جديدة</h1>
        <form id="reset-form">
          <div class="field">
            <label for="new-password">كلمة المرور الجديدة</label>
            <input
              id="new-password"
              name="password"
              type="password"
              minlength="12"
              maxlength="128"
              autocomplete="new-password"
              required
            />
          </div>
          <div class="field">
            <label for="new-password-confirm">تأكيد كلمة المرور</label>
            <input
              id="new-password-confirm"
              name="confirm"
              type="password"
              minlength="12"
              autocomplete="new-password"
              required
            />
          </div>
          <p class="field-error" role="alert"></p>
          <button class="button button-primary full-width" id="reset-submit" type="submit">
            حفظ كلمة المرور
          </button>
        </form>
        <p id="reset-message" role="status"></p>
        <a class="button button-secondary full-width" id="reset-login" hidden>تسجيل الدخول</a>
      </section>
    </template>

    <template id="order-step-template">
      <li class="timeline-step">
        <h3></h3>
        <small></small>
      </li>
    </template>

    <template id="addresses-template">
      <div class="account-layout">
        <section id="saved-addresses" class="address-list" aria-label="العناوين المحفوظة"></section>
        <form class="panel" id="address-form">
          <h2>إضافة عنوان</h2>
          <div class="form-grid">
            <div class="field full-span">
              <label for="address-label">اسم العنوان</label
              ><input
                id="address-label"
                name="label"
                required
                maxlength="50"
                placeholder="المنزل"
              />
            </div>
            <div class="field">
              <label for="address-city">المدينة</label
              ><input id="address-city" name="city" required minlength="2" maxlength="100" />
            </div>
            <div class="field">
              <label for="address-district">الحي</label
              ><input
                id="address-district"
                name="district"
                required
                minlength="2"
                maxlength="100"
              />
            </div>
            <div class="field full-span">
              <label for="address-street">الشارع ورقم المبنى</label
              ><input id="address-street" name="street" required minlength="4" maxlength="255" />
            </div>
            <div class="field full-span">
              <label for="address-postal">الرمز البريدي (اختياري)</label
              ><input id="address-postal" name="postal" pattern="[0-9]{5}" inputmode="numeric" />
            </div>
          </div>
          <p class="field-error" role="alert"></p>
          <button class="button button-primary" type="submit">حفظ العنوان</button>
        </form>
      </div>
    </template>

    <template id="address-item-template">
      <article class="panel">
        <h2 data-bind="label"></h2>
        <p class="muted" data-bind="address"></p>
        <button class="button button-secondary" data-bind="remove" type="button">
          حذف العنوان
        </button>
      </article>
    </template>
  </body>
</html>
